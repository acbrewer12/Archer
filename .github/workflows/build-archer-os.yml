name: Build Archer OS Image

on:
  workflow_dispatch:
  push:
    branches: [claude/archer-truck-ai-system-TlfGE]
    paths:
      - 'archer-os/**'
      - 'usb-os/**'
      - 'pi/**'
      - 'archer.py'
      - 'archer_*.html'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Build Archer OS VM image
        run: |
          chmod +x archer-os/build-vm.sh
          sudo ARCHER_LOCAL_SRC="$GITHUB_WORKSPACE" bash archer-os/build-vm.sh

      - name: Upload VMware VMDK artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: archer-os-vmdk
          path: archer-os.vmdk
          retention-days: 3

      - name: Upload raw image artifact (fallback)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: archer-os-raw-gz
          path: archer-os.img.gz
          retention-days: 3
