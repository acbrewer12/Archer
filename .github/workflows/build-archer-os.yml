name: Build Archer OS Image

on:
  workflow_dispatch:
  push:
    branches: [claude/archer-truck-ai-system-TlfGE]
    paths:
      - 'archer-os/**'
      - 'archer.py'
      - 'archer_*.html'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Build Archer OS VM image
        run: |
          chmod +x archer-os/build-vm.sh
          sudo bash archer-os/build-vm.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: archer-os
          path: archer-os.img.gz
          retention-days: 14
