name: Build Archer APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['android-apk/**']
  workflow_dispatch:
    inputs:
      archer_url:
        description: 'Archer server URL (blank = HuggingFace Space)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 ────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Android SDK ────────────────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform + Build Tools
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      # ── 4. Gradle ─────────────────────────────────────────────────────────
      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # ── 5. Write google-services.json from secret ────────────────────────
      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android-apk/app/google-services.json

      # ── 6. Patch Archer URL ───────────────────────────────────────────────
      - name: Set Archer URL
        run: |
          URL="${{ github.event.inputs.archer_url }}"
          if [ -z "$URL" ]; then
            URL="https://aydencatman-archer.hf.space"
          fi
          echo "Building APK for: $URL"
          find android-apk -name "*.java" \
            -exec sed -i "s|ARCHER_URL_PLACEHOLDER|$URL|g" {} +

      # ── 7. Build debug APK (auto-signed, sideloadable) ────────────────────
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --project-dir android-apk

      # ── 7. Rename for clarity ─────────────────────────────────────────────
      - name: Rename APK
        run: |
          mv android-apk/app/build/outputs/apk/debug/app-debug.apk \
             android-apk/app/build/outputs/apk/debug/Archer.apk

      # ── 8. Publish to GitHub Release (replaces previous, no artifact storage used)
      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes 2>/dev/null || true
          git push origin :refs/tags/latest-apk 2>/dev/null || true
          gh release create latest-apk \
            --title "Archer APK — Latest Build" \
            --notes "Built from commit $(git rev-parse --short HEAD) on $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --prerelease \
            android-apk/app/build/outputs/apk/debug/Archer.apk

      # ── 9. Upload to Firebase App Distribution ───────────────────────────
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: android-apk/app/build/outputs/apk/debug/Archer.apk
          releaseNotes: "Build ${{ github.run_number }} — commit ${{ github.sha }}"
