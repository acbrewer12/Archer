name: Check Archer Prices

on:
  schedule:
    # Runs daily at 13:00 UTC (8am Central).
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # trigger manually from the Actions tab anytime

jobs:
  check-prices:
    runs-on: ubuntu-latest

    # FlareSolverr is the third-engine fallback for sites that defeat both
    # Patchright and Camoufox. It starts automatically alongside the job
    # and shuts down when the job ends — no setup or teardown needed.
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install patchright camoufox[geoip] nodriver gspread google-auth requests curl-cffi
          patchright install chromium
          python -m camoufox fetch
          # nodriver uses the system Chrome that's pre-installed on ubuntu-latest runners

      # Wait for the FlareSolverr container to be ready before we start
      # checking prices — it takes a few seconds to initialize.
      - name: Wait for FlareSolverr
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8191/ && echo "FlareSolverr ready" && break
            echo "Waiting for FlareSolverr... ($i/30)"
            sleep 2
          done

      - name: Run price check
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FLARESOLVERR_URL: http://localhost:8191/v1
          # Optional — set these secrets to unlock residential proxy engines.
          # ScraperAPI: free tier at scraperapi.com (1000 credits/month, no CC).
          # ZenRows: paid service (~$49/month) for maximum coverage.
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          ZENROWS_API_KEY: ${{ secrets.ZENROWS_API_KEY }}
        run: python check_prices.py
