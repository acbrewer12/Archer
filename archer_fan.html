<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0000">
<title>ARCHER — Fan Q&amp;A</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&family=Quicksand:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#080002;color:#fff;font-family:'Quicksand',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}

.hdr{background:#0d0005;border-bottom:2px solid #cc0000;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px}
.hdr-left{display:flex;flex-direction:column}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:6px;color:#cc0000;line-height:1}
.hdr-sub{font-size:8px;color:#552222;letter-spacing:3px;font-family:'Share Tech Mono',monospace;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.sign-in-btn{background:#1a0000;border:1px solid #440000;border-radius:20px;padding:5px 14px;font-size:10px;color:#ff6644;font-family:'Share Tech Mono',monospace;letter-spacing:1px;cursor:pointer;text-decoration:none;transition:all 0.15s;white-space:nowrap}
.sign-in-btn:active{background:#2a0000;border-color:#cc0000}
.user-chip{display:flex;align-items:center;gap:6px}
.user-name{font-size:10px;color:#ff8866;font-family:'Share Tech Mono',monospace;letter-spacing:1px}
.dash-btn{background:#1a0000;border:1px solid #440000;border-radius:20px;padding:5px 12px;font-size:10px;color:#ffaa88;font-family:'Share Tech Mono',monospace;letter-spacing:1px;cursor:pointer;text-decoration:none;white-space:nowrap}

.stats-bar{background:#0d0005;border-bottom:1px solid #1a0008;padding:6px 16px;display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.stats-bar::-webkit-scrollbar{display:none}
.stat-chip{display:flex;flex-direction:column;align-items:center;flex-shrink:0;min-width:48px}
.stat-val{font-size:13px;font-weight:700;color:#ff4422;font-family:'Share Tech Mono',monospace;line-height:1}
.stat-lbl{font-size:8px;color:#552222;letter-spacing:2px;font-family:'Share Tech Mono',monospace;margin-top:2px}

.info-strip{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;scrollbar-width:none;flex-shrink:0;border-bottom:1px solid #1a0008}
.info-strip::-webkit-scrollbar{display:none}
.info-card{background:#0d0005;border:1px solid #2a0010;border-radius:10px;padding:9px 13px;flex-shrink:0;min-width:120px}
.info-icon{font-size:18px;margin-bottom:3px}
.info-label{font-size:8px;color:#552222;letter-spacing:2px;font-family:'Share Tech Mono',monospace;margin-bottom:2px}
.info-val{font-size:12px;font-weight:700;color:#ff8866;line-height:1.3}

.chat-area{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:8px}
.chat-area::-webkit-scrollbar{width:3px}
.chat-area::-webkit-scrollbar-track{background:transparent}
.chat-area::-webkit-scrollbar-thumb{background:#330010;border-radius:2px}

.msg{display:flex;gap:8px;align-items:flex-start;max-width:90%}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg-bubble{padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5;font-weight:500;word-break:break-word}
.msg.archer .msg-bubble{background:#0d0005;border:1px solid #2a0010;color:#ddbbbb;border-bottom-left-radius:4px}
.msg.user .msg-bubble{background:#2a0008;border:1px solid #550020;color:#ffcccc;border-bottom-right-radius:4px}
.msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;margin-top:2px}
.msg.archer .msg-avatar{background:radial-gradient(circle,#cc0000,#330000);border:2px solid #cc0000}
.msg.user .msg-avatar{background:#1a0008;border:1px solid #440020;font-size:11px}
.msg-tag{font-size:8px;letter-spacing:2px;font-family:'Share Tech Mono',monospace;margin-bottom:2px;color:#660022}
.msg.user .msg-tag{text-align:right;color:#885544}

.typing-bubble{padding:9px 13px;background:#0d0005;border:1px solid #2a0010;border-radius:14px;border-bottom-left-radius:4px;display:inline-flex;gap:4px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#660022;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.2}40%{opacity:1}}

.suggestions{padding:0 12px 6px;display:flex;flex-wrap:wrap;gap:5px;flex-shrink:0}
.sug-chip{background:#0d0005;border:1px solid #2a0010;border-radius:20px;padding:5px 11px;font-size:10px;color:#cc6644;cursor:pointer;font-family:'Share Tech Mono',monospace;letter-spacing:0.5px;transition:all 0.15s;white-space:nowrap}
.sug-chip:active{background:#200008;border-color:#cc0000;color:#ff8866}

.input-bar{background:#0d0005;border-top:1px solid #2a0010;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
#fan-input{flex:1;background:#150008;border:1px solid #330010;border-radius:22px;padding:9px 15px;color:#fff;font-family:'Quicksand',sans-serif;font-size:13px;outline:none;-webkit-appearance:none;min-width:0}
#fan-input::placeholder{color:#552222}
.fan-mic-btn{width:38px;height:38px;border-radius:50%;background:#150008;border:2px solid #440020;color:#cc4444;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s}
.fan-mic-btn.active{background:rgba(204,0,0,0.2);border-color:#cc0000;color:#ff4422}
.fan-send-btn{width:38px;height:38px;border-radius:50%;background:#cc0000;border:none;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.fan-send-btn:active{transform:scale(0.92);background:#aa0000}

.history-bar{background:#0d0005;border-top:1px solid #1a0008;padding:4px 12px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.history-label{font-size:8px;color:#552222;letter-spacing:2px;font-family:'Share Tech Mono',monospace}
.clear-btn{font-size:9px;color:#552222;font-family:'Share Tech Mono',monospace;letter-spacing:1px;cursor:pointer;padding:3px 8px;border:1px solid #1a0008;border-radius:10px;background:none}
.clear-btn:active{color:#cc0000;border-color:#cc0000}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-left">
    <div class="hdr-title">ARCHER</div>
    <div class="hdr-sub">2006 GMC SIERRA 2500HD</div>
  </div>
  <div class="hdr-right" id="hdr-right">
    <!-- filled by JS -->
  </div>
</div>

<div class="stats-bar">
  <div class="stat-chip"><div class="stat-val" id="f-speed">--</div><div class="stat-lbl">MPH</div></div>
  <div class="stat-chip"><div class="stat-val" id="f-rpm">--</div><div class="stat-lbl">RPM</div></div>
  <div class="stat-chip"><div class="stat-val" id="f-boost">--</div><div class="stat-lbl">BOOST</div></div>
  <div class="stat-chip"><div class="stat-val" id="f-eth">--</div><div class="stat-lbl">ETHANOL</div></div>
  <div class="stat-chip"><div class="stat-val" id="f-oil">--</div><div class="stat-lbl">OIL &deg;F</div></div>
  <div class="stat-chip"><div class="stat-val" id="f-bat">--</div><div class="stat-lbl">VOLTS</div></div>
</div>

<div class="info-strip">
  <div class="info-card">
    <div class="info-icon">🏗</div>
    <div class="info-label">YEAR / MODEL</div>
    <div class="info-val">2006 GMC Sierra 2500HD</div>
  </div>
  <div class="info-card">
    <div class="info-icon">⚙️</div>
    <div class="info-label">ENGINE</div>
    <div class="info-val" id="f-engine">6.0L LQ4 V8</div>
  </div>
  <div class="info-card">
    <div class="info-icon">⛽</div>
    <div class="info-label">FUEL</div>
    <div class="info-val">E85 Flex Fuel</div>
  </div>
  <div class="info-card">
    <div class="info-icon">🔧</div>
    <div class="info-label">BUILD STATUS</div>
    <div class="info-val" id="f-phase">Phase 1 &mdash; In Progress</div>
  </div>
  <div class="info-card">
    <div class="info-icon">📍</div>
    <div class="info-label">HOME BASE</div>
    <div class="info-val">Salem, Missouri</div>
  </div>
</div>

<div class="suggestions" id="suggestions">
  <div class="sug-chip" onclick="askQuestion('What engine does Archer have?')">Engine?</div>
  <div class="sug-chip" onclick="askQuestion('What fuel does Archer run?')">Fuel?</div>
  <div class="sug-chip" onclick="askQuestion('What mods does Archer have?')">Mods?</div>
  <div class="sug-chip" onclick="askQuestion('What is the build plan?')">Build plan?</div>
  <div class="sug-chip" onclick="askQuestion('How fast is Archer?')">How fast?</div>
  <div class="sug-chip" onclick="askQuestion('What boost does Archer make?')">Boost?</div>
</div>

<div class="chat-area" id="chat"></div>

<!-- History bar — shown only for signed-in users -->
<div class="history-bar" id="history-bar" style="display:none">
  <span class="history-label" id="history-label">CHAT SAVED</span>
  <button class="clear-btn" onclick="clearHistory()">CLEAR</button>
</div>

<div class="input-bar">
  <button class="fan-mic-btn" id="fan-mic" onclick="toggleFanMic()">🎤</button>
  <input id="fan-input" type="text" placeholder="Ask about the truck..." onkeydown="if(event.key==='Enter')sendFanQuestion()">
  <button class="fan-send-btn" onclick="sendFanQuestion()">&#8593;</button>
</div>

<script>
const BASE = window.location.origin;
const USER = window.ARCHER_USER || null;
const STORAGE_KEY = USER ? 'archer_fan_chat_' + USER.name : null;
const MAX_SAVED = 60;

let micActive = false;
const SRClass = window.SpeechRecognition || window.webkitSpeechRecognition;
let sr = null;

// ── HEADER AUTH UI ──
(function renderHeader() {
  const el = document.getElementById('hdr-right');
  if (USER) {
    el.innerHTML =
      '<div class="user-chip">' +
        '<span class="user-name">&#128100; ' + esc(USER.name.toUpperCase()) + '</span>' +
        '<a class="dash-btn" href="/">&#8592; DASHBOARD</a>' +
      '</div>';
    // Show history bar
    const hb = document.getElementById('history-bar');
    if (hb) hb.style.display = 'flex';
    const hl = document.getElementById('history-label');
    if (hl) hl.textContent = 'CHAT SAVED • ' + USER.name.toUpperCase();
  } else {
    el.innerHTML = '<a class="sign-in-btn" href="/register">SIGN IN</a>';
  }
})();

// ── LIVE STATS ──
async function pollStats() {
  try {
    const r = await fetch(BASE + '/display_data');
    const d = await r.json();
    const set = (id, v) => { const e = document.getElementById(id); if (e && v != null) e.textContent = v; };
    set('f-speed', Math.round(d.speed || 0));
    set('f-rpm', d.rpm || 750);
    set('f-boost', (d.boost || 0) + ' PSI');
    set('f-eth', (d.ethanol != null ? d.ethanol : '--') + '%');
    set('f-oil', d.oil_temp || '--');
    set('f-bat', d.battery ? d.battery.toFixed(1) + 'V' : '--');
    const sc = d.supercharged || false;
    const ph = d.build_phase || 1;
    const eng = document.getElementById('f-engine');
    const phEl = document.getElementById('f-phase');
    if (eng) eng.textContent = sc ? 'LSA 6.2L Supercharged V8' : '6.0L LQ4 V8';
    if (phEl) phEl.textContent = 'Phase ' + ph + (ph >= 2 ? ' — Supercharged' : ' — In Progress');
  } catch(e) {}
}
pollStats();
setInterval(pollStats, 6000);

// ── CHAT HELPERS ──
const chatEl = document.getElementById('chat');
let chatHistory = []; // {role, text} objects

function esc(t) {
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMsg(role, text, appendToDOM) {
  const isArcher = role === 'archer';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML =
    '<div class="msg-avatar">' + (isArcher ? '🔴' : '💬') + '</div>' +
    '<div><div class="msg-tag">' + (isArcher ? 'ARCHER' : (USER ? esc(USER.name.toUpperCase()) : 'YOU')) + '</div>' +
    '<div class="msg-bubble">' + esc(text) + '</div></div>';
  if (appendToDOM !== false) {
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
  }
  return div;
}

function addMsg(role, text) {
  renderMsg(role, text);
  chatHistory.push({role, text});
  saveHistory();
}

function showTyping() {
  const d = document.createElement('div');
  d.className = 'msg archer';
  d.id = 'typing-indicator';
  d.innerHTML =
    '<div class="msg-avatar">🔴</div>' +
    '<div><div class="msg-tag">ARCHER</div>' +
    '<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>';
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const d = document.getElementById('typing-indicator');
  if (d) d.remove();
}

// ── LOCAL STORAGE CHAT ──
function saveHistory() {
  if (!STORAGE_KEY) return;
  try {
    const toSave = chatHistory.slice(-MAX_SAVED);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
  } catch(e) {}
}

function loadHistory() {
  if (!STORAGE_KEY) return false;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || !saved.length) return false;
    chatHistory = saved;
    saved.forEach(m => renderMsg(m.role, m.text));
    chatEl.scrollTop = chatEl.scrollHeight;
    // Hide suggestions if there's history
    const sugs = document.getElementById('suggestions');
    if (sugs) sugs.style.display = 'none';
    return true;
  } catch(e) { return false; }
}

function clearHistory() {
  if (!STORAGE_KEY) return;
  try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
  chatHistory = [];
  chatEl.innerHTML = '';
  addWelcome();
  document.getElementById('suggestions').style.display = 'flex';
}

function addWelcome() {
  const greeting = USER
    ? 'Hey ' + USER.name + ', welcome back. Chat is saved on this device. Ask me anything about the truck.'
    : 'Hey, welcome to the fan page. I\'m Archer — a 2006 GMC Sierra 2500HD being built into something serious. Ask me anything about the truck, the build, or what I\'m running right now.';
  renderMsg('archer', greeting);
}

// ── INIT ──
const hadHistory = loadHistory();
if (!hadHistory) addWelcome();

// ── SEND QUESTION ──
async function sendFanQuestion() {
  const inp = document.getElementById('fan-input');
  const q = inp.value.trim();
  if (!q) return;
  inp.value = '';
  const sugs = document.getElementById('suggestions');
  if (sugs) sugs.style.display = 'none';
  addMsg('user', q);
  showTyping();
  try {
    const r = await fetch(BASE + '/fans/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    });
    const d = await r.json();
    removeTyping();
    const resp = d.response || "I'm not sure about that one.";
    addMsg('archer', resp);
    ttsSpeak(resp);
  } catch(e) {
    removeTyping();
    addMsg('archer', "Can't reach my server right now. Try again in a second.");
  }
}

function askQuestion(q) {
  document.getElementById('fan-input').value = q;
  sendFanQuestion();
}

// ── MIC ──
function toggleFanMic() {
  if (micActive) { if (sr) sr.stop(); return; }
  if (!SRClass) { document.getElementById('fan-input').focus(); return; }
  sr = new SRClass();
  sr.lang = 'en-US';
  sr.interimResults = false;
  sr.onresult = function(e) {
    document.getElementById('fan-input').value = e.results[0][0].transcript;
    sendFanQuestion();
  };
  sr.onend = function() { micActive = false; setMicUI(false); };
  sr.onerror = function() { micActive = false; setMicUI(false); };
  sr.start();
  micActive = true;
  setMicUI(true);
}

function setMicUI(on) {
  const btn = document.getElementById('fan-mic');
  btn.classList.toggle('active', on);
  btn.textContent = on ? '⏹' : '🎤';
}

// ── TTS ──
function ttsSpeak(text) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 1.0; u.pitch = 1;
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
