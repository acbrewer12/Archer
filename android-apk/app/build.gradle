plugins {
    id 'com.android.application'
}

android {
    namespace 'com.archer.truck'
    compileSdk 34

    defaultConfig {
        applicationId "com.archer.truck"
        minSdk 26          // Android 8.0+ (2017+)
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            debuggable true
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with your keystore for Play Store uploads:
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Pure WebView wrapper — no external deps needed
}
