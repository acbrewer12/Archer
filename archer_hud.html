<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Archer HUD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Share Tech Mono',monospace;user-select:none}
:root{
  --red:#cc0000;
  --amber:#ffaa00;
  --green:#00cc44;
  --label:#555;   /* was #333 — improved from 1.6:1 to 2.9:1 */
  --text2:#777;   /* was #555 — improved from 2.9:1 to 4.5:1 */
}
body{display:flex;flex-direction:column}

/* TOP BAR */
#topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;height:42px;flex-shrink:0;
  background:#050505;border-bottom:1px solid #111
}
#tb-logo{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:5px;color:var(--red)}
#tb-clock{font-size:14px;letter-spacing:2px;color:#888}
#tb-obd{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:1px;color:#777}
#obd-dot{width:8px;height:8px;border-radius:50%;background:#222;transition:background 0.4s}
#obd-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
#obd-dot.sim{background:#ff6600;box-shadow:0 0 5px #ff6600}

/* MESSAGE STRIP */
#msg-strip{
  display:flex;align-items:center;gap:8px;
  padding:0 14px;height:28px;flex-shrink:0;
  background:#050505;border-bottom:1px solid #2a0000;overflow:hidden
}
#msg-label{font-size:8px;letter-spacing:2px;color:var(--red);flex-shrink:0}
#msg-text{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.5s}
#msg-text.fresh{color:#cc6600}

/* SPEED ZONE */
#speed-zone{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;padding:8px 70px
}
#speed-arc-svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-52%);pointer-events:none;will-change:transform}
#speed-arc-bg{stroke:#1a1a1a;fill:none;stroke-width:6;stroke-linecap:round}
#speed-arc-fill{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.3s ease,stroke 0.4s ease;will-change:stroke-dashoffset}
#speed-num{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(120px,45vw,240px);
  line-height:0.88;color:#fff;
  letter-spacing:-6px;text-align:center;
  font-weight:900;
  transition:color 0.4s ease,text-shadow 0.4s ease;
  will-change:color;
}
#speed-num.amber{color:var(--amber);text-shadow:0 0 40px rgba(255,170,0,0.3)}
#speed-num.hot{color:var(--red);text-shadow:0 0 60px rgba(204,0,0,0.5),0 0 120px rgba(204,0,0,0.2)}
#speed-unit{font-size:10px;letter-spacing:5px;color:#777;margin-top:6px}
#hud-gear-indicator{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;color:#777;margin-top:4px;transition:color 0.3s}
/* Side panels */
.side-panel{position:absolute;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
#panel-left{left:10px;text-align:center}
#panel-right{right:10px;text-align:center}
.side-val{font-family:'Bebas Neue',sans-serif;font-size:clamp(28px,8vw,40px);line-height:1;transition:color 0.3s;will-change:color;transform:translateZ(0)}
.side-lbl{font-size:8px;letter-spacing:1px;color:#777}
/* Warning border */
#warn-ring{position:absolute;inset:0;border:3px solid var(--red);pointer-events:none;opacity:0;transition:opacity 0.2s}
#warn-ring.on{opacity:1;animation:warnpulse 0.5s ease-in-out infinite}
@keyframes warnpulse{0%,100%{opacity:1}50%{opacity:0.25}}

/* RPM BAR — enhanced with color zones and tick marks */
#rpm-wrap{padding:5px 14px 6px;flex-shrink:0}
#rpm-bar-container{position:relative;height:18px}
#rpm-track{background:#0d0d0d;height:14px;border-radius:3px;overflow:hidden;border:1px solid #111;position:relative}
#rpm-fill{
  height:100%;width:12%;border-radius:3px;
  transition:width 0.15s ease-out,background-color 0.2s,box-shadow 0.2s;
  will-change:width;
}
/* Tick marks overlay */
#rpm-ticks{position:absolute;top:0;left:0;right:0;height:14px;pointer-events:none}
.rpm-tick{position:absolute;top:0;bottom:0;width:1px;background:#000;opacity:0.4}
.rpm-tick.major{opacity:0.7;width:2px}
/* Redline marker */
#rpm-redline{position:absolute;top:0;bottom:0;width:3px;background:#ff0000;opacity:0.8;border-radius:1px;box-shadow:0 0 6px rgba(255,0,0,0.8)}
#rpm-labels{display:flex;justify-content:space-between;font-size:7px;color:#666;margin-top:2px;padding:0 1px}
#rpm-footer{display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-top:2px}

/* STATS ROW */
#statsrow{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:2px solid #1a0000;background:#050505;
  flex-shrink:0;height:54px
}
.hstat{display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid #0d0d0d;padding:4px 2px}
.hstat:last-child{border-right:none}
.hstat-val{font-family:'Bebas Neue',sans-serif;font-size:24px;line-height:1;transition:color 0.3s;will-change:color;transform:translateZ(0)}
.hstat-lbl{font-size:7px;letter-spacing:1px;color:#777;margin-top:2px}
</style>
</head>
<body>

<div id="topbar">
  <div id="tb-logo">ARCHER</div>
  <div id="tb-clock">--:--</div>
  <div id="tb-obd"><div id="obd-dot"></div><span id="obd-label">SIM</span></div>
</div>

<div id="msg-strip">
  <span id="msg-label">ARCHER</span>
  <span id="msg-text">Online. Everything looks good.</span>
</div>

<div id="speed-zone">
  <div class="side-panel" id="panel-left">
    <div class="side-val" id="sl-gear" style="color:#777">—</div>
    <div class="side-lbl">GEAR</div>
  </div>

  <!-- Speed arc SVG — progress arc scaled to speed limit (75 mph) -->
  <svg id="speed-arc-svg" width="220" height="220" viewBox="0 0 220 220">
    <path id="speed-arc-bg"
      d="M 110 195 A 90 90 0 1 1 109.99 195"
      stroke-dasharray="520" stroke-dashoffset="0"/>
    <path id="speed-arc-fill"
      d="M 110 195 A 90 90 0 1 1 109.99 195"
      stroke="#cc0000"
      stroke-dasharray="520" stroke-dashoffset="520"/>
  </svg>

  <div id="speed-num">0</div>
  <div id="speed-unit">MPH</div>
  <div id="hud-gear-indicator">GEAR —</div>

  <div class="side-panel" id="panel-right">
    <div class="side-val" id="sl-boost" style="color:#ff6600">0</div>
    <div class="side-lbl">BOOST PSI</div>
  </div>

  <div id="warn-ring"></div>
</div>

<div id="rpm-wrap">
  <div id="rpm-bar-container">
    <div id="rpm-track">
      <div id="rpm-fill"></div>
      <!-- Tick marks at 500 RPM intervals -->
      <div id="rpm-ticks"></div>
    </div>
    <div id="rpm-redline"></div>
  </div>
  <div id="rpm-labels">
    <span>0</span><span>1k</span><span>2k</span><span>3k</span><span>4k</span><span>5k</span><span>6.5k</span>
  </div>
  <div id="rpm-footer">
    <span>ENGINE RPM</span>
    <span id="rpm-val">750</span>
  </div>
</div>

<!-- NAVIGATION STRIP -->
<div id="nav-strip" style="background:#050505;border-top:1px solid #0d0d0d;border-bottom:1px solid #0d0d0d;padding:5px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0">
  <div id="nav-arrow" style="font-size:22px;color:#666;flex-shrink:0;transition:color 0.3s">↑</div>
  <div style="flex:1;min-width:0">
    <div id="nav-instruction" style="font-size:11px;color:#777;letter-spacing:1px;font-family:'Share Tech Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">No active route</div>
    <div id="nav-road" style="font-size:9px;color:#666;letter-spacing:1px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></div>
  </div>
  <div id="nav-dist" style="font-size:13px;color:#666;letter-spacing:1px;font-family:'Bebas Neue',sans-serif;flex-shrink:0"></div>
</div>

<div id="statsrow">
  <div class="hstat">
    <div class="hstat-val" id="hs-oil" style="color:#777">195°</div>
    <div class="hstat-lbl">OIL °F</div>
  </div>
  <div class="hstat">
    <div class="hstat-val" id="hs-cool" style="color:#666">190°</div>
    <div class="hstat-lbl">COOLANT</div>
  </div>
  <div class="hstat">
    <div class="hstat-val" id="hs-bat" style="color:var(--green)">13.8V</div>
    <div class="hstat-lbl">BATTERY</div>
  </div>
  <div class="hstat">
    <div class="hstat-val" id="hs-eth" style="color:#4488ff">---</div>
    <div class="hstat-lbl">E85</div>
  </div>
</div>

<script>
let lastMsg = '';
let msgTimer = null;

function $(id){ return document.getElementById(id); }
function set(id, v){ const e=$(id); if(e) e.textContent=v; }
function clr(id, c){ const e=$(id); if(e) e.style.color=c; }

function updateClock() {
  set('tb-clock', new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true}));
}

function applyData(d) {
  const rpm   = d.rpm      ?? 750;
  const speed = d.speed    ?? 0;
  const boost = d.boost    ?? 0;
  const oil   = d.oil_temp ?? 195;
  const cool  = d.coolant  ?? 190;
  const bat   = d.battery  ?? 13.8;
  const gear  = d.gear;
  const warn  = d.warning  ?? false;
  const msg   = d.archer_msg || '';

  // Speed — number + arc + gear indicator
  const sEl = $('speed-num');
  if (sEl) {
    // Smooth lerp
    const cur = parseInt(sEl.textContent) || 0;
    sEl.textContent = Math.round(cur + (Math.round(speed) - cur) * 0.35);
    if (speed > 80)      sEl.className = 'hot';
    else if (speed > 65) sEl.className = 'amber';
    else                 sEl.className = '';
  }

  // Speed progress arc (520px circumference, speed limit = 75mph → full arc)
  const arcFill = $('speed-arc-fill');
  if (arcFill) {
    const CIRC = 520, LIMIT = 75;
    const pct    = Math.min(1.2, speed / LIMIT);  // allow slight overshoot
    const offset = CIRC - (pct * CIRC);
    arcFill.style.strokeDashoffset = offset;
    arcFill.style.stroke = speed > LIMIT ? '#cc0000' : speed > LIMIT * 0.85 ? '#ffaa00' : '#444';
  }

  // Gear indicator below speed
  const gearInd = $('hud-gear-indicator');
  if (gearInd) {
    gearInd.textContent = gear != null ? 'GEAR  ' + gear : 'GEAR  —';
    gearInd.style.color = rpm > 5500 ? '#cc0000' : rpm > 4000 ? '#ffaa00' : '#555';
  }

  // Gear side panel
  set('sl-gear', gear != null ? gear : '—');

  // Boost
  set('sl-boost', Math.round(boost));
  clr('sl-boost', boost > 18 ? '#ff3300' : '#ff6600');

  // RPM — colored zones: green 0-2500, yellow 2500-4500, red 4500+
  const RPM_MAX = 6500, REDLINE = 6500;
  const pct = Math.min(100, (rpm / RPM_MAX) * 100);
  const fill = $('rpm-fill');
  if (fill) {
    fill.style.width = pct + '%';
    if (rpm >= 4500) {
      fill.style.background = 'linear-gradient(90deg,#00cc44 0%,#ffaa00 38%,#cc0000 69%,#ff0000 100%)';
      fill.style.boxShadow  = '0 0 10px rgba(204,0,0,0.7)';
    } else if (rpm >= 2500) {
      fill.style.background = 'linear-gradient(90deg,#00cc44 0%,#ffaa00 60%,#ff8800 100%)';
      fill.style.boxShadow  = '0 0 6px rgba(255,170,0,0.5)';
    } else {
      fill.style.background = '#00cc44';
      fill.style.boxShadow  = 'none';
    }
  }
  // Redline marker position
  const redlineEl = $('rpm-redline');
  if (redlineEl) {
    redlineEl.style.left = ((REDLINE / RPM_MAX) * 100).toFixed(1) + '%';
  }
  // Generate tick marks (once)
  const ticksEl = $('rpm-ticks');
  if (ticksEl && !ticksEl._built) {
    ticksEl._built = true;
    let html = '';
    for (let r = 500; r < RPM_MAX; r += 500) {
      const pos = (r / RPM_MAX * 100).toFixed(2);
      const isMajor = r % 1000 === 0;
      html += `<div class="rpm-tick${isMajor ? ' major' : ''}" style="left:${pos}%"></div>`;
    }
    ticksEl.innerHTML = html;
  }
  set('rpm-val', Math.round(rpm).toLocaleString() + ' RPM');

  // Oil
  set('hs-oil', Math.round(oil) + '°');
  clr('hs-oil', oil > 225 ? '#ff3300' : oil > 210 ? 'var(--amber)' : '#777');

  // Coolant
  set('hs-cool', Math.round(cool) + '°');
  clr('hs-cool', cool > 230 ? '#ff3300' : cool > 215 ? 'var(--amber)' : '#666');

  // Battery
  set('hs-bat', parseFloat(bat).toFixed(1) + 'V');
  clr('hs-bat', bat < 12.0 ? '#ff3300' : bat < 12.8 ? 'var(--amber)' : 'var(--green)');

  // E85
  if (d.ethanol != null && d.ethanol > 0) {
    set('hs-eth', Math.round(d.ethanol) + '%');
    clr('hs-eth', d.ethanol < 30 ? '#ff3300' : d.ethanol < 55 ? 'var(--amber)' : '#4488ff');
  } else {
    set('hs-eth', '---');
    clr('hs-eth', '#333');
  }

  // Warning ring
  $('warn-ring').className = warn ? 'on' : '';

  // Navigation strip — detect destination from server
  const dest = d.destination || '';
  const road = d.road || '';
  const navInstr = $('nav-instruction');
  const navRoad  = $('nav-road');
  const navArrow = $('nav-arrow');
  const navDist  = $('nav-dist');
  if (dest) {
    // Active navigation — show destination info
    const ARROWS = {'left':'←', 'right':'→', 'straight':'↑', 'u-turn':'↩', 'merge':'↗'};
    const dir = ARROWS['straight'];  // default to straight; real nav would parse direction
    if (navArrow) { navArrow.textContent = dir; navArrow.style.color = '#00aaff'; }
    if (navInstr) { navInstr.textContent = 'Heading to: ' + dest; navInstr.style.color = '#00aaff'; }
    if (navRoad)  navRoad.textContent = road || '';
    if (navDist)  navDist.style.color = '#00aaff';
  } else {
    if (navArrow) { navArrow.textContent = '↑'; navArrow.style.color = '#333'; }
    if (navInstr) { navInstr.textContent = 'No active route'; navInstr.style.color = '#333'; }
    if (navRoad)  navRoad.textContent = road ? 'On: ' + road : '';
    if (navDist)  { navDist.textContent = ''; }
  }

  // Archer message
  if (msg && msg !== lastMsg) {
    const el = $('msg-text');
    el.textContent = msg;
    el.className = 'fresh';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(() => { el.className = ''; }, 4000);
    lastMsg = msg;
  }
}

function updateObd(connected) {
  const dot = $('obd-dot');
  const lbl = $('obd-label');
  if (connected) { dot.className = 'live'; lbl.textContent = 'LIVE'; }
  else           { dot.className = 'sim';  lbl.textContent = 'SIM'; }
}

let tick = 0;
async function poll() {
  try {
    const r = await fetch('/display_data');
    const d = await r.json();
    applyData(d);
    if (tick++ % 5 === 0) {
      const s = await fetch('/sim/status').then(r=>r.json()).catch(()=>({}));
      updateObd(!!s.obd_connected);
    }
  } catch(e) {}
  updateClock();
}

poll();
setInterval(poll, 800);
</script>
</body>
</html>
