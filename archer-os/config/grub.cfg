#!/bin/sh
# Archer OS GRUB entry — replaces default distributor entry
exec tail -n +3 $0

# ── GRUB superuser / edit-mode password ────────────────────────────
# Without this, anyone with physical/USB access to the head unit can hit
# 'e' (edit) or 'c' (command line) at the GRUB prompt, append init=/bin/sh
# to the kernel cmdline, and get an instant root shell — bypassing
# archer_init.c and every auth check it does.
#
# Real PBKDF2 hash generated via `grub-mkpasswd-pbkdf2` — not a placeholder.
# The password itself was never typed anywhere it could be logged; only
# this hash (safe to store — that's the point of PBKDF2) was ever shared.
#
# --unrestricted on the "Archer OS" entry below is the officially
# documented pattern for "some entries bootable without a password while
# superusers is set" (GRUB manual, node "Authentication and authorisation":
# grub-mkconfig's auto-generated entries — the ones from /etc/grub.d/10_linux,
# for whichever kernel(s) the build actually installed — have NO WAY to be
# marked --unrestricted (grub-mkconfig has no authentication support at
# all, per the manual), so once superusers is set, EVERY auto-generated
# entry requires the password to boot, not just to edit. That's the
# opposite of what a truck head unit needs. This hand-written entry, with
# --id archer-os below and a matching GRUB_DEFAULT=archer-os in
# /etc/default/grub (set by build.sh), is what makes normal boot work
# with no password prompt despite that.
#
# The kernel-version placeholder below is substituted by build.sh
# with the real installed kernel's version suffix before this file is
# copied into /etc/grub.d/40_archer — there is no generic, unsuffixed
# /boot/vmlinuz or /boot/initrd.img anywhere in this build pipeline (every
# kernel installed here, stock or — once a custom kernel build lands —
# custom-compiled, only ever lands as a version-suffixed file). This entry
# referenced those generic names directly for a while without anything
# ever creating them, so it could never have actually booted; confirmed by
# grepping build.sh/build-vm.sh/kernel/build-kernel.sh for any place that
# creates a non-suffixed /boot/vmlinuz or /boot/initrd.img — there isn't
# one. See build.sh for exactly how the substitution happens.
# The kernel command-line placeholder below is substituted by build.sh
# from a single ARCHER_CMDLINE variable that ALSO feeds
# GRUB_CMDLINE_LINUX_DEFAULT in /etc/default/grub. Never hardcode it
# here again: a hand-written menuentry writes its own `linux` line and
# therefore does NOT inherit GRUB_CMDLINE_LINUX_DEFAULT, while
# GRUB_DEFAULT=archer-os makes THIS entry the one that boots. The two
# drifted apart and it cost a real hardware boot: this entry was missing
# init=/sbin/archer_init entirely (so the machine silently booted systemd
# instead of archer_init) and missing the efifb/vesafb disable (so
# simpledrm never got the framebuffer and Xorg had no DRM device).

set superusers="root"
password_pbkdf2 root grub.pbkdf2.sha512.10000.FE933E2055F1610D255E81B93015BDC280638486E82328E8C7D76C2A27357A3EFED8E4C56D6E8ECE60338F5455D9CFC7811F5A81B531C8B9D41DCA9F4457D4B2.73B40D847DBDB567AF60495CAB815E285F02EDC3F46F7FF3795D615B11A705038291D97EDEE252733FB06C635721FD6B3113E528D276E2FACDE4015300F8C93C

menuentry "Archer OS" --unrestricted --id archer-os {
    insmod all_video
    insmod gzio
    insmod part_gpt
    insmod ext2
    search --no-floppy --label --set=root ARCHER_OS
    linux   /boot/vmlinuz-__ARCHER_KERNEL_VERSION__ root=LABEL=ARCHER_OS __ARCHER_CMDLINE__
    initrd  /boot/initrd.img-__ARCHER_KERNEL_VERSION__
}
