#!/bin/sh
# Archer OS GRUB entry — replaces default distributor entry
exec tail -n +3 $0

# ── GRUB superuser / edit-mode password ────────────────────────────
# Without this, anyone with physical/USB access to the head unit can hit
# 'e' (edit) or 'c' (command line) at the GRUB prompt, append init=/bin/sh
# to the kernel cmdline, and get an instant root shell — bypassing
# archer_init.c and every auth check it does.
#
# CHANGE_ME_RUN_grub-mkpasswd-pbkdf2 below is a PLACEHOLDER, not a working
# password — it must be replaced before this protects anything. Generate a
# real hash with:
#
#     grub-mkpasswd-pbkdf2
#
# and paste its "grub.pbkdf2.sha512.<...>" output in place of the
# placeholder. This is called out as a required manual step in build.sh.
#
# --unrestricted on the "Archer OS" entry below means normal boot still
# happens with no password prompt (GRUB_TIMEOUT=0 boots it immediately
# anyway) — only editing/command-line access requires the superuser
# password, and there is no other, unprotected entry to fall back to.
set superusers="root"
password_pbkdf2 root grub.pbkdf2.sha512.CHANGE_ME_RUN_grub-mkpasswd-pbkdf2

menuentry "Archer OS" --unrestricted {
    insmod all_video
    insmod gzio
    insmod part_gpt
    insmod ext2
    search --no-floppy --label --set=root ARCHER_OS
    linux   /boot/vmlinuz root=LABEL=ARCHER_OS quiet splash loglevel=0
    initrd  /boot/initrd.img
}
