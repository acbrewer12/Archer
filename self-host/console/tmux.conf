# /etc/tmux.conf — shared by every account on the server.
#
# The physical console (tty1) and SSH clients (phone, PC) attach to the same
# tmux session, and a tmux window can only have one size. Size it to the
# screen that was used most recently, so whichever device you're typing on
# gets the full view, and the other shows a same-sized copy.
set -g window-size latest

# The unused part of the larger screen is filled with dots by default, which
# made the monitor look broken whenever the phone was the active screen.
# Leave it blank instead.
set -g fill-character ' '
