# sysctl drop-in. Install to /etc/sysctl.d/60-archer-tailscale-bind.conf
# then: sudo sysctl --system
#
# Caddy's private block binds the Tailscale IP, which only exists once
# tailscaled has connected. At boot Caddy can get there first and fail with
# "cannot assign requested address" (seen on this server after a hard reset,
# taking down both Caddy blocks and Jellyfin). This lets a process bind an
# address the box doesn't have yet; traffic flows once Tailscale is up.
net.ipv4.ip_nonlocal_bind = 1
