# systemd drop-in for caddy.service. Install to
#   /etc/systemd/system/caddy.service.d/tailscale.conf
# then: sudo systemctl daemon-reload
#
# The private Caddy block binds the server's Tailscale IP. Ordering after
# tailscaled only guarantees tailscaled has STARTED, not that the IP is up
# yet, so this works together with 60-archer-tailscale-bind.conf (which lets
# Caddy bind that IP before it exists). Restart= covers anything else that
# makes Caddy exit at boot.
[Unit]
Wants=tailscaled.service
After=tailscaled.service

[Service]
Restart=on-failure
RestartSec=5
